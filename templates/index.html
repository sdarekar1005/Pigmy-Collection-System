<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PigmyFlow | Collection management</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pigmyflow-theme.css') }}">
</head>
<body>
  <section id="login-screen" class="login-shell">
    <form id="login-form" class="login-card">
      <div class="brand-mark">P</div><p class="eyebrow">PIGMYFLOW</p><h1>Welcome back</h1>
      <p class="muted">Sign in to manage your daily collections.</p>
      <label>Username<input name="username" autocomplete="username" required placeholder="Your username"></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required placeholder="Your password"></label>
      <button class="primary wide" type="submit">Sign in</button><p id="login-error" class="form-error"></p>
    </form>
  </section>
  <section id="setup-screen" class="login-shell hidden">
    <form id="setup-form" class="login-card">
      <div class="brand-mark">P</div><p class="eyebrow">FIRST-RUN SETUP</p><h1>Create the first agent</h1>
      <p class="muted">This secure one-time setup creates the initial administrator account.</p>
      <label>Agent name<input name="name" required></label><label>Agent ID<input name="agent_id" required></label>
      <label>Mobile<input name="mobile" required></label><label>Email<input name="email" type="email" required></label>
      <label>Password<input name="password" type="password" minlength="8" required></label><label>Confirm password<input name="confirm_password" type="password" minlength="8" required></label>
      <button class="primary wide">Create first agent</button><p id="setup-error" class="form-error"></p>
    </form>
  </section>
  <div id="app" class="app-shell hidden">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand"><span class="brand-mark small">P</span><span>Pigmy<span>Flow</span></span><button id="close-menu" class="icon-button">×</button></div>
      <nav>
        <button class="nav-link active" data-page="dashboard"><span>▦</span>Dashboard</button>
        <button class="nav-link" data-page="collection"><span>＋</span>Today's Collection</button>
        <button class="nav-link" data-page="customers"><span>♙</span>Customer List</button>
        <button class="nav-link" data-page="addcustomer"><span>＋</span>Add Customer</button>
        <button class="nav-link" data-page="transactions"><span>◷</span>Transaction History</button>
        <button class="nav-link" data-page="history"><span>◷</span>Collection History</button>
        <button class="nav-link" data-page="reports"><span>▤</span>Reports</button>
        <button class="nav-link" data-page="pending"><span>!</span>Pending List</button>
        <button class="nav-link" data-page="summary"><span>▤</span>Agent Summary</button>
        <button class="nav-link" data-page="endday"><span>✓</span>End of Day</button>
      </nav>
      <div class="sidebar-foot"><button class="nav-link" data-page="profile"><span>◉</span>Agent profile</button><button class="nav-link" data-page="settings"><span>⚙</span>Settings</button><button id="logout" class="nav-link danger"><span>↪</span>Logout</button></div>
    </aside>
    <main class="main">
      <header class="topbar"><button id="menu-toggle" class="icon-button menu">☰</button><div><p class="eyebrow" id="page-kicker">OVERVIEW</p><h1 id="page-title">Dashboard</h1></div><div class="topbar-end"><span class="today" id="today"></span><div class="avatar" id="avatar">A</div><div class="user-name"><strong id="user-name"></strong><small id="user-role"></small></div></div></header>
      <div id="flash" class="flash hidden"></div>
      <section id="dashboard-page" class="page"></section>
      <section id="customers-page" class="page hidden"></section>
      <section id="collection-page" class="page hidden"></section>
      <section id="history-page" class="page hidden"></section>
      <section id="transactions-page" class="page hidden"></section>
      <section id="reports-page" class="page hidden"></section>
      <section id="pending-page" class="page hidden"></section>
      <section id="endday-page" class="page hidden"></section>
      <section id="summary-page" class="page hidden"></section>
      <section id="profile-page" class="page hidden"></section>
      <section id="settings-page" class="page hidden"></section>
    </main>
  </div>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script>
    /* Minimal extension of the existing customer list: no layout redesign. */
    document.addEventListener('click', async function (event) {
      const button = event.target.closest('[data-edit-customer]');
      if (!button) return;
      const detailResponse = await fetch(`/api/customers/${button.dataset.editCustomer}`);
      const detail = await detailResponse.json();
      if (!detailResponse.ok) { alert(detail.error || 'Unable to load customer.'); return; }
      const customer = detail.data.customer;
      const inactive = customer.status.toLowerCase() === 'inactive';
      const content = `<div class="login-card" style="position:fixed;z-index:20;inset:5vh 50%;transform:translateX(-50%);overflow:auto;max-height:90vh"><h2>Edit Customer</h2><form id="edit-customer-modal"><label>Customer Name<input name="name" value="${customer.name}" required></label><label>Mobile<input name="mobile" value="${customer.mobile}" required></label><label>Address<input name="address" value="${customer.address}" required></label><label>Daily Amount<input name="daily_amount" type="number" step=".01" value="${customer.daily_amount}" required></label><label>Status<select name="status"><option value="active" ${customer.status==='active'?'selected':''}>Active</option><option value="inactive" ${inactive?'selected':''}>Inactive</option></select></label><p id="delete-hint" class="muted">${inactive ? 'Inactive customers can be deleted.' : 'Set status to Inactive, save, then delete.'}</p><button type="button" id="delete-customer" class="secondary" ${inactive?'':'disabled'}>Delete Customer</button><button class="primary">Save Changes</button><button type="button" id="close-edit" class="secondary">Cancel</button></form></div>`;
      const modal=document.createElement('div');modal.id='customer-modal';modal.style.cssText='position:fixed;inset:0;background:#0008;z-index:19';modal.innerHTML=content;document.body.append(modal);
      document.querySelector('#close-edit').onclick=()=>modal.remove();
      document.querySelector('#edit-customer-modal').onsubmit=async e=>{e.preventDefault();const r=await fetch(`/api/customers/${customer.id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});if(!r.ok){alert((await r.json()).error);return}modal.remove();document.querySelector('[data-page="customers"]').click()};
      document.querySelector('#delete-customer').onclick=async()=>{if(!confirm('Are you sure you want to delete this customer?\nThis will remove the customer from the active customer list. Historical collection and transaction records will be preserved.'))return;const password=prompt('Enter your current password to confirm deletion');if(!password)return;const r=await fetch(`/api/customers/${customer.id}`,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirmation:'DELETE',current_password:password})});const b=await r.json();if(!r.ok){alert(b.error);return}modal.remove();alert('Customer deleted successfully. Historical records have been preserved.');document.querySelector('[data-page="customers"]').click()};
    });
    async function addEditCustomerButtons() {
      const response = await fetch('/api/customers');
      if (!response.ok) return;
      const payload = await response.json();
      document.querySelectorAll('#customers-page tbody tr').forEach(row => {
        const code = row.querySelector('.subtle')?.textContent?.trim();
        const customer = payload.data.customers.find(item => item.customer_id === code);
        if (customer && !row.querySelector('[data-edit-customer]')) {
          row.lastElementChild.insertAdjacentHTML('afterbegin', `<button class="secondary" data-edit-customer="${customer.id}">Edit</button> `);
        }
      });
    }
    new MutationObserver(() => addEditCustomerButtons()).observe(document.querySelector('#customers-page'), {childList:true, subtree:true});
  </script>
</body>
</html>
